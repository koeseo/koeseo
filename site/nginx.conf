server {
    listen 80;
    server_name www.koeseo.com;
    return 301 https://koeseo.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminiert Traefik davor; ohne dies macht nginx aus /#impressum
    # ein absolutes http://… und degradiert die Verbindung.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/html text/plain text/css application/javascript image/svg+xml;

    location = /impressum { return 301 /#impressum; }
    location = /kontakt   { return 301 /#kontakt; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
